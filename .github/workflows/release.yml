name: Stable Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build Universal GMS Stable Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "Using production release keystore from secrets."
          else
            echo "Release keystore secret not set; falling back to debug keystore for signing."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal GMS Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3584M -Dkotlin.daemon.jvm.options=-Xmx1536M -XX:+UseParallelGC"
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew :app:assembleUniversalGmsRelease --no-daemon --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: napster-gms-release
          path: app/build/outputs/apk/universalGms/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Napster ${{ github.ref_name || inputs.tag }}
          files: app/build/outputs/apk/universalGms/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
